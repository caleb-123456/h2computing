<!DOCTYPE html>
<html>

<head>
    <title>Round {{ round }} Scores</title>
</head>

<body>

<h1>Round {{ round }} Scores</h1>

<table border="1">

<tr>
    <th>Name</th>
    <th>Score</th>
</tr>

{% for row in data %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">Back to menu</a>

</body>

</html>
